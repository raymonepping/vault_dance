# config/defaults.conf: tracked defaults for image pins, host ports and names.
# scripts/compose.sh loads this file first and .env second, so any value can
# be overridden in .env without editing a compose file. scripts/common.sh,
# scripts/ports-check.sh and e2e/helpers/env.ts read the same names.

# ── Images (arm64; check Architecture after every pull) ───────────────────────
# Every Vault runs Enterprise, the seal node included.
VAULT_ENT_IMAGE=docker.io/hashicorp/vault-enterprise:2.2.1-ent
NODE_IMAGE=docker.io/library/node:24-alpine
NGINX_IMAGE=docker.io/library/nginx:1.30.0-alpine
ALPINE_IMAGE=docker.io/library/alpine:3.24.1
OPENLDAP_IMAGE=docker.io/osixia/openldap:1.5.0
KEYCLOAK_IMAGE=docker.io/keycloak/keycloak:26.8.1
# The two Linux servers Vault rotates passwords on.
ROCKY_IMAGE=docker.io/rockylinux/rockylinux:9.8.20260525.0
UBUNTU_IMAGE=docker.io/library/ubuntu:noble-20261024.1

# ── OS secrets engine plugin (registered with -download) ──────────────────────
# 0.2.1+ent or later: earlier builds fail licence wrapping on Vault 2.1+.
VDNC_OS_PLUGIN_VERSION=0.2.2+ent

# ── Host ports (all published on 127.0.0.1) ───────────────────────────────────
# Chosen to run beside vault_crypto (18800-18801, 13500-13502) and the older
# labs below it.
VDNC_PORT_VAULT_S=18900
VDNC_PORT_VAULT_1=18901
VDNC_PORT_VAULT_2=18902
VDNC_PORT_VAULT_3=18903
VDNC_PORT_API=13600
VDNC_PORT_WEB=13601
VDNC_PORT_KEYCLOAK=13602
VDNC_PORT_SSH_ROCKY=13622
VDNC_PORT_SSH_UBUNTU=13623

# ── Console ───────────────────────────────────────────────────────────────────
VDNC_WEB_CN=dance.localhost

# ── Application images (make app-build, make hosts-build) ─────────────────────
VDNC_IMAGE_PREFIX=localhost/vault-dance
VDNC_IMAGE_TAG=local
