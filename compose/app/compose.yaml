# compose/app/compose.yaml: the vault_dance console.
#
#   rotator      keeps the dance-api secret-id valid (vault_crypto / Durin pattern)
#   vault-agent  dance-api: token file in the `agent-token` volume, read by api
#   web-tls-init copies the lab CA's listener certificate into `web-tls` for nginx
#   api          the Node API: reads the token file per call (no VAULT_TOKEN env
#                var), proves credentials over SSH and LDAP, reads Vault's logs
#   web          nginx over TLS 1.3; React console + /api and /auth proxy
#
# The only credential handed over by a human is the rotator's own, in
# .secrets/vault/rotator/ (make rotator-bootstrap). Images: make app-build.

services:
  # One-shot: chown named volumes. uid 100 (vault) writes the AppRole files
  # and the token sink; gid 1000 (api) reads the sink; uid 101 (nginx) reads
  # the web certificate.
  volume-init:
    image: ${ALPINE_IMAGE}
    container_name: vdnc-app-volume-init
    user: "0:0"
    network_mode: none
    entrypoint:
      - /bin/sh
      - -c
      - >-
        chown 100:1000 /sink /approle && chmod 750 /sink && chmod 700 /approle &&
        install -d -m 0750 -o 101 -g 101 /web-tls &&
        install -m 0644 -o 101 -g 101 /src/vault.crt /web-tls/web.crt &&
        install -m 0600 -o 101 -g 101 /src/vault.key /web-tls/web.key &&
        install -m 0644 -o 101 -g 101 /src/ca-chain.pem /web-tls/ca-chain.pem &&
        echo '[volume-init] done'
    volumes:
      - agent-token:/sink
      - approle-app:/approle
      - web-tls:/web-tls
      - ../../vault-tls:/src:ro
    restart: "no"

  rotator:
    image: ${VAULT_ENT_IMAGE}
    container_name: vdnc-rotator
    hostname: rotator
    user: "100:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp, /home/vault]
    entrypoint: ["/bin/sh", "/vault/rotator/rotator.sh"]
    environment:
      VAULT_ADDR: https://vault-1:8200
      VAULT_CACERT: /vault/tls/ca-chain.pem
      TARGET_ROLES: dance-api
      ROTATOR_CREDS_DIR: /run/rotator
      CHECK_INTERVAL_SECONDS: "60"
      ROTATE_BELOW_FRACTION: "3"
      WARN_IF_SHORTER_THAN: "7776000"
    volumes:
      - ../../vault-tls/ca-chain.pem:/vault/tls/ca-chain.pem:ro
      - ../common/rotator:/vault/rotator:ro
      - ../../.secrets/vault/rotator:/run/rotator:ro        # human-delivered credential
      - approle-app:/run/approle                            # persistent: current secret-id
    networks: [default]
    restart: unless-stopped
    depends_on:
      volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "/bin/sh /vault/rotator/healthcheck.sh"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5

  vault-agent:
    image: ${VAULT_ENT_IMAGE}
    container_name: vdnc-vault-agent
    hostname: vault-agent
    user: "100:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp, /home/vault]
    entrypoint: ["/bin/sh", "/vault/agent/entrypoint.sh"]
    environment:
      AGENT_NAME: dance-api
      APPROLE_DIR: /run/approle/dance-api
      TOKEN_FILE: /vault/secrets/token
      VAULT_ADDR: https://vault-1:8200
      VAULT_CACERT: /vault/tls/ca-chain.pem
      HOME: /home/vault
    volumes:
      - ../../vault-tls/ca-chain.pem:/vault/tls/ca-chain.pem:ro
      - ../common/agent/entrypoint.sh:/vault/agent/entrypoint.sh:ro
      - ./agent/config.hcl:/vault/agent/config.hcl:ro
      - approle-app:/run/approle:ro       # written by the rotator
      - agent-token:/vault/secrets        # ephemeral: token sink
    networks: [default]
    restart: on-failure
    depends_on:
      rotator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /vault/secrets/token && VAULT_TOKEN=$$(cat /vault/secrets/token) vault token lookup >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  api:
    image: ${VDNC_IMAGE_PREFIX}/api:${VDNC_IMAGE_TAG}
    container_name: vdnc-api
    hostname: api
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      PORT: "3000"
      VAULT_NODES: https://vault-1:8200,https://vault-2:8200,https://vault-3:8200
      VAULT_SEAL_ADDR: https://vault-s:8200
      VAULT_TOKEN_FILE: /run/vault/token
      VAULT_LOG_DIRS: /var/log/vault/vault-1,/var/log/vault/vault-2,/var/log/vault/vault-3
      HOST_KEYS_DIR: /etc/vdnc/hosts
      LDAP_URL: ldap://openldap:389
      VAULT_UI_URL: https://localhost:${VDNC_PORT_VAULT_1}
      CONSOLE_URL: https://localhost:${VDNC_PORT_WEB}
      KEYCLOAK_PUBLIC_URL: http://localhost:${VDNC_PORT_KEYCLOAK}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      NODE_EXTRA_CA_CERTS: /etc/vdnc/ca-chain.pem
    ports: ["127.0.0.1:${VDNC_PORT_API}:3000"]
    volumes:
      - ../../vault-tls/ca-chain.pem:/etc/vdnc/ca-chain.pem:ro
      - ../../.secrets/hosts/host-rocky.pub:/etc/vdnc/hosts/host-rocky.pub:ro
      - ../../.secrets/hosts/host-ubuntu.pub:/etc/vdnc/hosts/host-ubuntu.pub:ro
      - agent-token:/run/vault:ro                     # vault-agent's token sink
      - vault-1-logs:/var/log/vault/vault-1:ro        # Vault's own log, for rotation errors
      - vault-2-logs:/var/log/vault/vault-2:ro
      - vault-3-logs:/var/log/vault/vault-3:ro
    mem_limit: 256m
    networks: [default]
    restart: unless-stopped
    depends_on:
      vault-agent:
        condition: service_healthy

  web:
    image: ${VDNC_IMAGE_PREFIX}/web:${VDNC_IMAGE_TAG}
    container_name: vdnc-web
    hostname: web
    user: "101:101"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
      NGINX_ENVSUBST_OUTPUT_DIR: /tmp
    ports: ["127.0.0.1:${VDNC_PORT_WEB}:8443"]
    volumes:
      - web-tls:/etc/nginx/tls:ro
    networks: [default]
    restart: unless-stopped
    depends_on:
      volume-init:
        condition: service_completed_successfully

networks:
  default:
    name: vdnc-internal
    external: true

volumes:
  agent-token: {}
  web-tls: {}
  approle-app:
    labels: { io.vdnc.data: "true" }
  vault-1-logs:
    external: true
    name: vdnc-vault_vault-1-logs
  vault-2-logs:
    external: true
    name: vdnc-vault_vault-2-logs
  vault-3-logs:
    external: true
    name: vdnc-vault_vault-3-logs
