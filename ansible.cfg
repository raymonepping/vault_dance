# ansible.cfg: run Ansible only through scripts/ansible.sh (it sets
# ANSIBLE_CONFIG to this file and handles Ansible's blocking-stdio check).
[defaults]
inventory = ansible/inventory.yml
roles_path = ansible/roles
private_key_file = .secrets/ansible/id_ed25519
host_key_checking = True
interpreter_python = auto_silent
retry_files_enabled = False
stdout_callback = default
callback_result_format = yaml
nocows = True

[ssh_connection]
# Host keys pinned by make hosts-keyscan (read through podman exec, no TOFU).
ssh_args = -o UserKnownHostsFile=.secrets/hosts/known_hosts -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
